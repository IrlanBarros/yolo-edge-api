name: Edge AI — Build, Test e Deploy
on:
  push:
    branches: [main]

jobs:
  test:
    name: "Lint & Tests"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar Dependências
        run: |
          pip install -r app/requirements.txt pytest ruff

      - name: Baixar Modelo e Criar Link para Testes
        run: |
          mkdir -p models
          wget -O models/yolov8n.pt https://github.com/ultralytics/assets/releases/download/v8.2.0/yolov8n.pt
          sudo mkdir -p /app
          sudo ln -sfn "$GITHUB_WORKSPACE/models" /app/models

      - name: Lint (Ruff)
        run: ruff check app/ --exit-zero

      - name: Executar Pytest
        run: pytest tests/ -v

  build:
    name: "Build & Push (ARM64)"
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Configurar QEMU
        uses: docker/setup-qemu-action@v3

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e Push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.api
          platforms: linux/arm64
          push: true
          tags: ghcr.io/irlanbarros/yolo-edge-api/yolo-api:latest

  model-gate:
    name: "Model Quality Gate"
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar Dependências
        run: pip install ultralytics

      - name: Baixar Modelo para Validação
        run: |
          mkdir -p models
          wget -O models/yolov8n.pt https://github.com/ultralytics/assets/releases/download/v8.2.0/yolov8n.pt

      - name: Executar Validação (mAP@0.5 >= 0.50)
        run: python scripts/validate_model.py

  deploy:
    name: "Deploy → Raspberry Pi 5"
    needs: model-gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Conectar à rede Tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

      - name: Executar Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host:     ${{ secrets.RPI_HOST }}
          username: ${{ secrets.RPI_USER }}
          key:      ${{ secrets.RPI_SSH_KEY }}
          script: |
            cd ~/yolo-edge-api
            git pull origin main
            bash scripts/deploy.sh
