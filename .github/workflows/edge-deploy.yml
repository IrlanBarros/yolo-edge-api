name: Edge AI — Build, Test e Deploy
on:
  push:
    branches: [main]
jobs:
  test:
    name: "Lint & Tests"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r app/requirements.txt pytest ruff
      - run: ruff check app/
      - run: pytest tests/ -v
  build:
    name: "Build & Push (ARM64)"
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.api
          platforms: linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository }}/yolo-api:latest
  model-gate:
    name: "Model Quality Gate"
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install ultralytics dvc
      - run: python scripts/validate_model.py
  deploy:
    name: "Deploy → Raspberry Pi 5"
    needs: model-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host:     ${{ secrets.RPI_HOST }}
          username: ${{ secrets.RPI_USER }}
          key:      ${{ secrets.RPI_SSH_KEY }}
          script: |
            cd ~/yolo-edge-api
            git pull origin main
            bash scripts/deploy.sh
